<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CELESTIAL BODIES ANALYSIS</title>
    <style>
        * {
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body { 
            font-family: 'Malgun Gothic', sans-serif; 
            background-color: #ffffff; 
            color: #333; 
            overflow-x: hidden; 
        }

        #sidebar {
            position: fixed;
            top: 0;
            left: -250px;
            width: 250px;
            height: 100%;
            background-color: white;
            color: gray;
            transition: 0.3s;
            z-index: 1000;
            padding-top: 60px;
        }

        #sidebar.open { 
            left: 0;
        }
        
        #sidebar a {
            padding: 15px 25px;
            text-decoration: none;
            font-size: 18px;
            color: #333;
            display: block;
            transition: 0.2s;
        }

        #sidebar a:hover, #sidebar a.active { 
            background-color: white; 
            color: black; 
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 30px;
            cursor: pointer;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 2px solid #333;
            background-color: white;
        }
        .header-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            width: 50px;
        }

        .menu-icon { 
            font-size: 24px;
            line-height: 1; 
        }

        .icon-text { 
            font-size: 12px; 
            margin-top: 2px; 
        }

        .header-title {
            flex-grow: 1;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            padding: 10px;
            margin: 0 20px;
        }

        #searchBarContainer {
            display: none; 
            padding: 15px 20px;
            background-color: #f1f1f1;
            border-bottom: 2px solid #ddd;
        }
        #searchInput {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .container { 
            padding: 20px; 
            max-width: 1000px; 
            margin: 0 auto; 
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .card { border: 2px solid #333; display: flex; flex-direction: column; }
        .card-image {
            aspect-ratio: 1 / 1;
            background-color: #eaeaea;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            overflow: hidden;
        }

        .card-image img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }

        .card-bottom {
            border-top: 2px solid #333;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .info-text { 
            display: flex; 
            flex-direction: column; 
            gap: 5px; 
            flex-grow: 1; 
            margin-right: 15px; 
        }

        .info-name {
            padding: 5px;
            font-size: 16px;
            font-weight: bold;
        }

        .info-desc {
            padding: 5px;
            font-size: 12px;
            color: #555;
            font-family: 'Nanum Gothic', sans-serif;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .detail-btn {
            width: 40px; height: 40px;
            border-radius: 50%; border: 2px solid #333;
            background-color: transparent;
            font-size: 18px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
        }
        .detail-btn:hover { background-color: #eee; }

        @media (max-width: 600px) {
            .grid-container { grid-template-columns: 1fr; }
            .header-title { font-size: 16px; padding: 5px; }
        }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic&display=swap" rel="stylesheet">
</head>
<body>

    <div id="sidebar">
        <span class="close-btn" onclick="toggleSidebar()">×</span>
        <a href="#" class="category-btn active" data-category="all">전체 보기</a>
        <a href="#" class="category-btn" data-category="sun">태양 (Sun)</a>
        <a href="#" class="category-btn" data-category="moon">달   (Moon)</a>
        <a href="#" class="category-btn" data-category="galaxy">은하 (Galaxy)</a>
        <a href="#" class="category-btn" data-category="planet">행성 (Planet)</a>
    </div>

    <header class="header">
        <div class="header-btn" onclick="toggleSidebar()">
            <div class="menu-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </div>
        </div>
        
        <div class="header-title">CELESTIAL BODIES ANALYSIS</div>
        
        <div class="header-btn" onclick="toggleSearchBar()">
            <div class="menu-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </div>
        </div>
    </header>

    <div id="searchBarContainer">
        <input type="text" id="searchInput" placeholder="검색...">
    </div>

    <div class="container">
        <main class="grid-container" id="galleryGrid">
            </main>
    </div>

    <script>
        // 1. 테스트용 더미 데이터 세팅 (나중에 백엔드 API에서 받아올 데이터 형태)
        const celestialData = [
            { id: 1, name: "안드로메다 은하", category: "galaxy", desc: "우리 은하와 가장 가까운 나선 은하입니다. 250만 광년 떨어져 있습니다.", icon: "🌌" },
            { id: 2, name: "목성", category: "planet", desc: "태양계에서 가장 큰 가스 행성으로, 거대한 대적점이 특징입니다.", icon: "🪐" },
            { id: 3, name: "오리온 성운", category: "nebula", desc: "맨눈으로도 볼 수 있는 밝은 성운으로, 새로운 별들이 태어나는 곳입니다.", icon: "✨" },
            { id: 4, name: "화성", category: "planet", desc: "붉은 행성이라 불리며, 과거에 물이 흘렀던 흔적이 있습니다.", icon: "🔴" },
            { id: 5, name: "솜브레로 은하", category: "galaxy", desc: "모자 모양을 닮은 독특한 형태의 나선 은하입니다.", icon: "🛸" },
            { id: 6, name: "게 성운", category: "nebula", desc: "초신성 폭발의 잔해로 이루어진 아름다운 성운입니다.", icon: "💥" }
        ];

        let currentCategory = "all";

        function renderCards(data) {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = "";

            if (data.length === 0) {
                grid.innerHTML = "<p style='grid-column: span 2; text-align:center; padding: 50px;'>검색 결과가 없습니다.</p>";
                return;
            }

            data.forEach(item => {
                const cardHTML = `
                    <div class="card">
                        <div class="card-image">${item.icon}</div>
                        <div class="card-bottom">
                            <div class="info-text">
                                <div class="info-name">${item.name}</div>
                                <div class="info-desc">${item.desc}</div>
                            </div>
                            <button class="detail-btn" onclick="alert('${item.name} 상세 페이지로 이동합니다.')">➔</button>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHTML;
            });
        }

        function filterData() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            
            const filteredData = celestialData.filter(item => {
                const matchCategory = (currentCategory === "all") || (item.category === currentCategory);
                const matchSearch = item.name.toLowerCase().includes(searchText) || item.desc.toLowerCase().includes(searchText);
                
                return matchCategory && matchSearch;
            });

            renderCards(filteredData);
        }

        // 4. UI 제어 함수들
        function toggleSidebar() {
            document.getElementById("sidebar").classList.toggle("open");
        }

        function toggleSearchBar() {
            const searchBar = document.getElementById("searchBarContainer");
            if (searchBar.style.display === "block") {
                searchBar.style.display = "none";
                document.getElementById('searchInput').value = "";
                filterData();
            } else {
                searchBar.style.display = "block";
                document.getElementById('searchInput').focus(); 
            }
        }

        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault(); 
                
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                currentCategory = this.getAttribute('data-category');
                filterData();
                toggleSidebar(); 
            });
        });

        document.getElementById('searchInput').addEventListener('input', filterData);

        renderCards(celestialData);

    </script>
</body>
</html>
