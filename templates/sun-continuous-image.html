<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTROVISION - SERIES IMAGE ANALYSIS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; }
        body { background-color: #ffffff; color: #000000; display: flex; flex-direction: column; min-height: 100vh; padding: 20px; }
        
        header { border-bottom: 2px solid #000; padding-bottom: 20px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: flex-end; }
        h1 { font-size: 32px; letter-spacing: 2px; font-weight: 800; text-transform: uppercase; }
        .subtitle { font-size: 16px; font-weight: bold; color: #555; }
        
        nav { display: flex; gap: 10px; margin-bottom: 20px; }
        nav a { text-decoration: none; padding: 10px 20px; border: 2px solid #000; color: #000; font-weight: bold; background: #fff; transition: 0.2s; }
        nav a:hover { background: #000; color: #fff; }
        nav a.active { background: #000; color: #fff; pointer-events: none; }

        main { display: flex; flex-direction: column; gap: 30px; max-width: 1200px; margin: 0 auto; width: 100%; }

        .control-panel { border: 2px solid #000; padding: 25px; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; background-color: #fafafa; }
        .control-group { display: flex; flex-direction: column; gap: 8px; }
        .control-group label { font-weight: bold; font-size: 14px; }
        input[type="file"] { border: 1px solid #000; padding: 10px; background: #fff; font-size: 14px; outline: none; }
        
        .btn { background: #000; color: #fff; border: 2px solid #000; padding: 10px 20px; font-weight: bold; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        .btn:hover { background: #fff; color: #000; }
        .btn:disabled { background: #ccc; border-color: #ccc; cursor: not-allowed; }

        .result-container { display: flex; gap: 30px; flex-wrap: wrap; display: none; }
        .image-view { flex: 1; min-width: 400px; border: 2px solid #000; padding: 15px; display: flex; flex-direction: column; align-items: center; background: #fff; }
        .image-view h3 { margin-bottom: 15px; border-bottom: 2px solid #000; padding-bottom: 5px; width: 100%; text-align: center; }
        canvas { max-width: 100%; height: auto; border: 1px solid #eee; }
        
        .data-view { flex: 1; min-width: 400px; display: flex; flex-direction: column; }
        .data-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid #000; padding-bottom: 5px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #000; padding: 12px; text-align: center; font-size: 14px; }
        th { background-color: #000; color: #fff; }
        
        .text-blue { color: #0000ff; font-weight: bold; }
        .text-red { color: #ff0000; font-weight: bold; }
        
        .history-section { border-top: 4px solid #000; padding-top: 30px; margin-top: 20px; }
        .history-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .history-list li { border: 1px solid #000; padding: 15px; background: #fff; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>ASTROVISION</h1>
            <div class="subtitle">SOLAR SERIES IMAGE ANALYSIS</div>
        </div>
    </header>
    
    <nav>
        <a href="/sun-single-image">1. 단일 영상 분석</a>
        <a href="/sun-continuous-image" class="active">2. 연속 영상 분석</a>
    </nav>

    <main>
        <section class="control-panel">
            <div class="control-group">
                <label>연속 태양 영상 업로드 (2장 이상의 사진을 한 번에 선택하세요)</label>
                <input type="file" id="seriesUpload" accept="image/*" multiple onchange="resetContainer()">
            </div>
            <button class="btn" id="analyzeBtn" onclick="analyzeSeries()">연속 분석 실행</button>
        </section>

        <section class="result-container" id="resultContainer">
            <div class="image-view">
                <h3>템플릿 매칭 추적 결과 (1번 프레임 → 2번 프레임)</h3>
                <canvas id="resultCanvas"></canvas>
            </div>
            
            <div class="data-view">
                <div class="data-header">
                    <h3>흑점 이동 벡터 데이터 리스트</h3>
                    <button class="btn" onclick="downloadCSV()">CSV 추출</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>시작 좌표(X, Y)</th>
                            <th>종료 좌표(X, Y)</th>
                            <th>ΔX (이동량)</th>
                            <th>ΔY (이동량)</th>
                            <th>직선 거리</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody"></tbody>
                </table>
            </div>
        </section>

        <section class="history-section">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px; align-items: center;">
                <h2>연속 영상 분석 히스토리 로그 (DB)</h2>
                <button class="btn" style="background:#fff; color:#ff0000; border-color:#ff0000;" onclick="clearDB()">로그 초기화</button>
            </div>
            <ul class="history-list" id="historyList"></ul>
        </section>
    </main>

    <script>
        let currentData = [];
        const DB_KEY = 'astrovision_continuous_db';

        // 페이지 로드 시 로컬 DB 로그 자동 로드
        document.addEventListener('DOMContentLoaded', loadHistoryFromDB);

        function resetContainer() {
            document.getElementById('resultContainer').style.display = 'none';
        }

        // Flask 서버의 /analyze_series 엔드포인트와 통신하는 핵심 비즈니스 로직
        function analyzeSeries() {
            const fileInput = document.getElementById('seriesUpload');
            if (fileInput.files.length < 2) {
                alert("연속 이동량 추적을 위해 최소 2장 이상의 태양 영상을 함께 선택해 주세요.");
                return;
            }

            const formData = new FormData();
            // 파이썬 request.files.getlist('images')에 대응하도록 다중 파일 주입
            for (let i = 0; i < fileInput.files.length; i++) {
                formData.append('images', fileInput.files[i]);
            }

            const btn = document.getElementById('analyzeBtn');
            btn.innerText = "매칭 연산 및 화살표 그리는 중...";
            btn.disabled = true;

            fetch('/analyze_series', { method: 'POST', body: formData })
            .then(response => response.json())
            .then(result => {
                btn.innerText = "연속 분석 실행";
                btn.disabled = false;

                if (result.status === 'fail') {
                    alert(result.message);
                    return;
                }
                
                if (result.data.length === 0) {
                    alert("지정한 유사도 임계값 내에서 매칭된 흑점 이동 궤적이 발견되지 않았습니다.");
                    return;
                }

                // 1) 캔버스 객체에 OpenCV 처리 결과 이미지 바인딩
                const canvas = document.getElementById('resultCanvas');
                const ctx = canvas.getContext('2d');
                const img = new Image();
                img.onload = function() {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                }
                img.src = "data:image/jpeg;base64," + result.image_base64;

                // 2) 데이터 배열을 테이블 행 요소로 파싱 및 UI 매핑
                currentData = result.data;
                const tbody = document.getElementById('dataTableBody');
                tbody.innerHTML = '';

                currentData.forEach(row => {
                    // 이동 방향에 따른 스타일 시각화 클래스 분기
                    const dxClass = row.dx > 0 ? 'text-blue' : (row.dx < 0 ? 'text-red' : '');
                    const dyClass = row.dy > 0 ? 'text-blue' : (row.dy < 0 ? 'text-red' : '');
                    const dxSign = row.dx > 0 ? '+' : '';
                    const dySign = row.dy > 0 ? '+' : '';

                    tbody.innerHTML += `
                        <tr>
                            <td>${row.id}</td>
                            <td>(${row.start_x}, ${row.start_y})</td>
                            <td>(${row.end_x}, ${row.end_y})</td>
                            <td class="${dxClass}">${dxSign}${row.dx} px</td>
                            <td class="${dyClass}">${dySign}${row.dy} px</td>
                            <td style="font-weight:bold;">${row.distance} px</td>
                        </tr>
                    `;
                });

                document.getElementById('resultContainer').style.display = 'flex';
                saveToDB(currentData);
            })
            .catch(error => {
                console.error('Error:', error);
                alert("연속 분석 서버 통신 중 오류가 발생했습니다.");
                btn.innerText = "연속 분석 실행";
                btn.disabled = false;
            });
        }

        // ==========================================
        // 3. 브라우저 로컬 데이터베이스 및 파일 추출 엔진
        // ==========================================
        function saveToDB(data) {
            const history = JSON.parse(localStorage.getItem(DB_KEY) || '[]');
            const record = { id: Date.now(), date: new Date().toLocaleString('ko-KR'), data: data };
            history.unshift(record);
            localStorage.setItem(DB_KEY, JSON.stringify(history));
            loadHistoryFromDB();
        }

        function loadHistoryFromDB() {
            const history = JSON.parse(localStorage.getItem(DB_KEY) || '[]');
            const listObj = document.getElementById('historyList');
            listObj.innerHTML = '';
            
            if(history.length === 0) {
                listObj.innerHTML = '<li style="justify-content:center; color:#666;">저장된 연속 분석 추적 데이터 로그가 없습니다.</li>';
                return;
            }
            
            history.forEach(item => {
                listObj.innerHTML += `
                    <li>
                        <div>
                            <strong>추적 일시: ${item.date}</strong>
                            <span style="font-size:13px; color:#666;">추적 및 매칭 성공 흑점: ${item.data.length} 개</span>
                        </div>
                    </li>
                `;
            });
        }

        function clearDB() {
            if(confirm('모든 연속 영상 분석 데이터 로그를 초기화하시겠습니까?')) {
                localStorage.removeItem(DB_KEY);
                loadHistoryFromDB();
            }
        }

        function downloadCSV() {
            if(currentData.length === 0) return;
            let csvContent = "data:text/csv;charset=utf-8,\uFEFFID,시작X,시작Y,종료X,종료Y,이동량X(dx),이동량Y(dy),직선거리\r\n";
            currentData.forEach(r => {
                csvContent += `${r.id},${r.start_x},${r.start_y},${r.end_x},${r.end_y},${r.dx},${r.dy},${r.distance}\r\n`;
            });
            const link = document.createElement("a");
            link.setAttribute("href", encodeURI(csvContent));
            link.setAttribute("download", `solar_continuous_track_report.csv`);
            document.body.appendChild(link);
            link.click();
            link.remove();
        }
    </script>
</body>
</html>
