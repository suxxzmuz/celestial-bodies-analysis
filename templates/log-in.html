<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log-in</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, sans-serif; 
        }

        :root {
            --bg-color: #f0f4f8;
            --text-color: #333333;
            --box-bg: #ffffff;
            --primary-color: #fffefe;
            --border-color: #cccccc;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        .login-container {
            background-color: var(--box-bg);
            padding: 2.5rem 2rem;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(123, 164, 227, 0.15); 
            width: 85%;
            max-width: 350px;
            text-align: center;
            transition: background-color 0.3s;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: black; 
        }

        p {
            font-size: 0.9rem;
            margin-bottom: 2rem;
            opacity: 0.8;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            background-color: var(--box-bg);
            color: var(--text-color);
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color); 
        }

        button.login-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: black;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button.login-btn:hover {
            background-color: #e0e6ed; 
        }

        button.login-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>로그인</h1>
        <p>아이디와 비밀번호를 입력해주세요.</p>
        
        <input type="text" id="userid" placeholder="아이디">
        <input type="password" id="userpw" placeholder="비밀번호">
        
        <button class="login-btn" onclick="checkLogin()">로그인</button>
    </div>

    <script>
        // 로그인 확인 함수
        function checkLogin() {
            const id = document.getElementById('userid').value.trim();
            const pw = document.getElementById('userpw').value.trim();

            if ((id === 'admin' || id === 'user') && pw === '123456789') {
                
                let displayName = (id === 'admin') ? '관리자' : '유저';
                localStorage.setItem('loggedInUser', displayName);
                
                alert(displayName + '님, 환영합니다!');
                window.location.href = '/'; 
            } else {
                alert('아이디나 비밀번호가 틀렸어요! 다시 확인해주세요.');
            }
        }
    </script>

</body>
</html>
