<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTROVISION</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box; 
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            justify-content: center;
            padding: 25px 20px;
            background-color: #ffffff;
            color: #000000;
            overflow-x: hidden; 
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding-bottom: 20px;
            margin-bottom: 40px;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            height: 2px;
            background-color: #000;
        }

        .user-icon {
            position: absolute;
            left: 0;
            top: -10px;
            width: 45px;
            height: 45px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .user-icon:hover {
            transform: scale(1.1);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px; 
            margin-bottom: 40px;
        }

        .card {
            border: 2px solid #000; 
            display: flex;
            flex-direction: column;
            aspect-ratio: 4 / 5;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #fff;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.1);
        }

        .card-image-placeholder {
            flex: 1; 
            border-bottom: 2px solid #000;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f9f9f9;
            color: #999;
            font-size: 14px;
            letter-spacing: 1px;
            overflow: hidden;
        }

        .card-text-placeholder {
            height: 60px; 
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .bottom-banner {
            border: 2px solid #000; 
            height: 60px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .bottom-banner:hover {
            background-color: #000;
            color: #fff;
        }

        @media (max-width: 600px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="user-icon" onclick="window.location.href='/log-in'" title="로그인 페이지로 이동">
                <svg viewBox="0 0 24 24" width="100%" height="100%">
                    <circle cx="12" cy="12" r="11" fill="none" stroke="black" stroke-width="1.5"/>
                    <circle cx="12" cy="9" r="4" fill="none" stroke="black" stroke-width="1.5"/>
                    <path d="M5.5 19.5c0-4 4-5.5 6.5-5.5s6.5 1.5 6.5 5.5" fill="none" stroke="black" stroke-width="1.5"/>
                </svg>
            </div>
            <h1>ASTROVISION</h1>
        </header>

        <main>
            <div class="grid-container" id="cardContainer"></div>
            <div class="bottom-banner" id="viewAllBtn">전체보기</div>
        </main>
    </div>

    <script>
        const celestialBodies = [
            { id: 1, name: '태양 (SUN)', imageText: 'IMAGE AREA', url: '/cat-sun-analysis' },
            { id: 2, name: '달 (MOON)', imageText: 'IMAGE AREA', url: '#' },
            { id: 3, name: '은하 (GALAXY)', imageText: 'IMAGE AREA', url: '#' },
            { id: 4, name: '행성 (PLANET)', imageText: 'IMAGE AREA', url: '#' }
        ];

        const cardContainer = document.getElementById('cardContainer');

        function renderCards() {
            celestialBodies.forEach(body => {
                const card = document.createElement('div');
                card.className = 'card';
                
                card.addEventListener('click', () => {
                    window.location.href = body.url;
                });

                card.innerHTML = `
                    <div class="card-image-placeholder">${body.imageText}</div>
                    <div class="card-text-placeholder">${body.name}</div>
                `;

                cardContainer.appendChild(card);
            });
        }

        const viewAllBtn = document.getElementById('viewAllBtn');
        viewAllBtn.addEventListener('click', () => {
            window.location.href = '/main'; 
        });

        document.addEventListener('DOMContentLoaded', renderCards);
    </script>

</body>
</html>
