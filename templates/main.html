<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTROVISION</title>
    <style>
        * {
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body { 
            font-family: 'Malgun Gothic', sans-serif; 
            background-color: #ffffff; 
            color: #333; 
            overflow-x: hidden; 
        }

        #sidebar {
            position: fixed;
            top: 0;
            left: -250px;
            width: 250px;
            height: 100%;
            background-color: white;
            color: gray;
            transition: 0.3s;
            z-index: 1000;
            padding-top: 60px;
        }

        #sidebar.open { 
            left: 0;
        }
        
        #sidebar a {
            padding: 15px 25px;
            text-decoration: none;
            font-size: 18px;
            color: #333;
            display: block;
            transition: 0.2s;
        }

        #sidebar a:hover, #sidebar a.active { 
            background-color: white; 
            color: black; 
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 30px;
            cursor: pointer;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 2px solid #333;
            background-color: white;
        }
        .header-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            width: 50px;
        }

        .menu-icon { 
            font-size: 24px;
            line-height: 1; 
        }

        .icon-text { 
            font-size: 24px; 
            margin-top: 2px; 
        }

        .header-title {
            flex-grow: 1;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            padding: 10px;
            margin: 0 20px;
        }

        #searchBarContainer {
            display: none; 
            padding: 15px 20px;
            background-color: #f1f1f1;
            border-bottom: 2px solid #ddd;
        }
        #searchInput {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .container { 
            padding: 20px; 
            max-width: 1000px; 
            margin: 0 auto; 
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .card { border: 2px solid #333; display: flex; flex-direction: column; }
        .card-image {
            aspect-ratio: 1 / 1;
            background-color: #eaeaea;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            overflow: hidden;
        }

        .card-image img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }

        .card-bottom {
            border-top: 2px solid #333;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .info-text { 
            display: flex; 
            flex-direction: column; 
            gap: 5px; 
            flex-grow: 1; 
            margin-right: 15px; 
        }

        .info-name {
            padding: 5px;
            font-size: 16px;
            font-weight: bold;
        }

        .info-desc {
            padding: 5px;
            font-size: 12px;
            color: #555;
            font-family: 'Nanum Gothic', sans-serif;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .detail-btn {
            width: 40px; height: 40px;
            border-radius: 50%; border: 2px solid #333;
            background-color: transparent;
            font-size: 18px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
        }
        .detail-btn:hover { background-color: #eee; }

        @media (max-width: 600px) {
            .grid-container { grid-template-columns: 1fr; }
            .header-title { font-size: 16px; padding: 5px; }
        }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic&display=swap" rel="stylesheet">
</head>
<body>

    <div id="sidebar">
        <span class="close-btn" onclick="toggleSidebar()">×</span>
        <a href="#" class="category-btn active" data-category="all">전체 보기</a>
        <a href="#" class="category-btn" data-category="sun">태양 (Sun)</a>
        <a href="#" class="category-btn" data-category="moon">달   (Moon)</a>
        <a href="#" class="category-btn" data-category="galaxy">은하 (Galaxy)</a>
        <a href="#" class="category-btn" data-category="planet">행성 (Planet)</a>
    </div>

    <header class="header">
        <div class="header-btn" onclick="toggleSidebar()">
            <div class="menu-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </div>
        </div>
        
        <div class="header-title">ASTROVISION</div>
        
        <div class="header-btn" onclick="toggleSearchBar()">
            <div class="menu-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </div>
        </div>
    </header>

    <div id="searchBarContainer">
        <input type="text" id="searchInput" placeholder="검색...">
    </div>

    <div class="container">
        <main class="grid-container" id="galleryGrid">
            </main>
    </div>

    <script>
        let celestialData = []; // 서버에서 받아올 데이터를 담을 변수
        let currentCategory = "all";

        // 서버(DB)에서 데이터를 가져오는 함수
        async function fetchPosts() {
            try {
                const response = await fetch('/api/posts');
                const result = await response.json();
                if (result.status === 'success') {
                    celestialData = result.data;
                    filterData(); // 데이터 로드 완료 후 렌더링
                }
            } catch (error) {
                console.error("데이터를 불러오는 중 에러 발생:", error);
            }
        }

        // 카드 렌더링 함수
        function renderCards(data) {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = "";

            if (data.length === 0) {
                grid.innerHTML = "<p style='grid-column: span 2; text-align:center; padding: 100px 0; color:#666;'>아직 등록된 분석 자료가 없습니다. 우측 상단의 '공유하기' 버튼을 눌러 첫 번째 분석 자료를 올려보세요!</p>";
                return;
            }

            data.forEach(item => {
                const cardHTML = `
                    <div class="card">
                        <div class="card-image">
                            <img src="${item.image_base64}" alt="분석이미지">
                        </div>
                        <div class="card-bottom">
                            <div class="info-text">
                                <div class="info-category">${item.category}</div>
                                <div class="info-name">${item.title}</div>
                            </div>
                            <button class="detail-btn" onclick="openDetailModal(${item.id})">➔</button>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHTML;
            });
        }

        // 검색 및 카테고리 필터링
        function filterData() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            const filteredData = celestialData.filter(item => {
                const matchCategory = (currentCategory === "all") || (item.category === currentCategory);
                const matchSearch = item.title.toLowerCase().includes(searchText) || item.description.toLowerCase().includes(searchText);
                return matchCategory && matchSearch;
            });
            renderCards(filteredData);
        }

        // 업로드 폼 제출 처리 (DB로 POST 전송)
        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const file = document.getElementById('uploadImage').files[0];
            if (!file) return;

            // 파일 크기가 너무 크면 제한 (SQLite 과부하 방지)
            if(file.size > 2 * 1024 * 1024) {
                alert("이미지 파일 크기는 2MB 이하여야 합니다.");
                return;
            }

            const submitBtn = document.querySelector('.submit-btn');
            submitBtn.innerText = "업로드 중...";
            submitBtn.disabled = true;

            const reader = new FileReader();
            reader.onload = async function(event) {
                const payload = {
                    title: document.getElementById('uploadTitle').value,
                    category: document.getElementById('uploadCategory').value,
                    description: document.getElementById('uploadDesc').value,
                    image: event.target.result // Base64 이미지
                };
                
                // 파이썬 DB API로 데이터 쏘기
                try {
                    const response = await fetch('/api/posts', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if(response.ok) {
                        // 성공 시 폼 초기화 및 새로고침
                        document.getElementById('uploadForm').reset();
                        closeUploadModal();
                        fetchPosts(); // DB에서 새로운 리스트 다시 불러오기
                    } else {
                        alert("업로드에 실패했습니다.");
                    }
                } catch (error) {
                    alert("서버 연결 오류가 발생했습니다.");
                } finally {
                    submitBtn.innerText = "자료 등록하기";
                    submitBtn.disabled = false;
                }
            };
            reader.readAsDataURL(file);
        });

        function openUploadModal() { document.getElementById('uploadModal').style.display = 'flex'; }
        function closeUploadModal() { document.getElementById('uploadModal').style.display = 'none'; }
        
        function openDetailModal(id) {
            const item = celestialData.find(d => d.id === id);
            if(!item) return;
            document.getElementById('detailImage').src = item.image_base64;
            document.getElementById('detailTitle').innerText = item.title;
            document.getElementById('detailCategory').innerText = item.category;
            document.getElementById('detailDesc').innerText = item.description;
            document.getElementById('detailModal').style.display = 'flex';
        }
        function closeDetailModal() { document.getElementById('detailModal').style.display = 'none'; }

        function toggleSidebar() { document.getElementById("sidebar").classList.toggle("open"); }
        function toggleSearchBar() {
            const searchBar = document.getElementById("searchBarContainer");
            if (searchBar.style.display === "block") {
                searchBar.style.display = "none";
                document.getElementById('searchInput').value = "";
                filterData();
            } else {
                searchBar.style.display = "block";
                document.getElementById('searchInput').focus(); 
            }
        }

        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault(); 
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentCategory = this.getAttribute('data-category');
                filterData();
                toggleSidebar(); 
            });
        });

        document.getElementById('searchInput').addEventListener('input', filterData);

        document.addEventListener('DOMContentLoaded', fetchPosts);
    </script>
</body>
</html>
